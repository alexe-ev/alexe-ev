<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 176" role="img" aria-label="The layer underneath AI products: economics to evals to routing to impact to skills to production">
  <style>
    text { font-family: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    .hdr { font-size: 10px; fill: #8886a0; letter-spacing: 3px; }
    .stage { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    .repo { font-size: 9.5px; fill: #e0dfe6; }
    .desc { font-size: 9px; fill: #8886a0; }
    .arrow { font-size: 16px; fill: #8886a0; }
  </style>
  <rect width="880" height="176" fill="#0a0a0f"/>
  <text x="26" y="26" class="hdr">THE LAYER UNDERNEATH</text>
  <rect x="806" y="16" width="6" height="6" fill="#00ff88" opacity="0.9"/>
  <rect x="818" y="16" width="6" height="6" fill="#4488ff" opacity="0.7"/>
  <rect x="830" y="16" width="6" height="6" fill="#aa77ff" opacity="0.7"/>
  <rect x="842" y="16" width="6" height="6" fill="#ffcc00" opacity="0.7"/>
  <rect x="854" y="16" width="6" height="6" fill="#ff4466" opacity="0.7"/>

  <!-- economics -->
  <rect x="26" y="48" width="128" height="88" fill="#12121a" stroke="#2a2a3a"/>
  <rect x="26" y="48" width="128" height="3" fill="#00ff88"/>
  <text x="90" y="76" text-anchor="middle" class="stage" fill="#00ff88">ECONOMICS</text>
  <text x="90" y="98" text-anchor="middle" class="repo">ai-economics</text>
  <text x="90" y="118" text-anchor="middle" class="desc">what it costs</text>
  <text x="161" y="97" class="arrow">&#8594;</text>

  <!-- evals -->
  <rect x="166" y="48" width="128" height="88" fill="#12121a" stroke="#2a2a3a"/>
  <rect x="166" y="48" width="128" height="3" fill="#4488ff"/>
  <text x="230" y="76" text-anchor="middle" class="stage" fill="#4488ff">EVALS</text>
  <text x="230" y="98" text-anchor="middle" class="repo">ai-ab-testing-tool</text>
  <text x="230" y="118" text-anchor="middle" class="desc">is it better</text>
  <text x="301" y="97" class="arrow">&#8594;</text>

  <!-- routing -->
  <rect x="306" y="48" width="128" height="88" fill="#12121a" stroke="#2a2a3a"/>
  <rect x="306" y="48" width="128" height="3" fill="#aa77ff"/>
  <text x="370" y="76" text-anchor="middle" class="stage" fill="#aa77ff">ROUTING</text>
  <text x="370" y="98" text-anchor="middle" class="repo">multi-model-router</text>
  <text x="370" y="118" text-anchor="middle" class="desc">which model</text>
  <text x="441" y="97" class="arrow">&#8594;</text>

  <!-- impact -->
  <rect x="446" y="48" width="128" height="88" fill="#12121a" stroke="#2a2a3a"/>
  <rect x="446" y="48" width="128" height="3" fill="#ffcc00"/>
  <text x="510" y="76" text-anchor="middle" class="stage" fill="#ffcc00">IMPACT</text>
  <text x="510" y="98" text-anchor="middle" class="repo">ml-impact-calculator</text>
  <text x="510" y="118" text-anchor="middle" class="desc">quality &#8594; money</text>
  <text x="581" y="97" class="arrow">&#8594;</text>

  <!-- skills -->
  <rect x="586" y="48" width="128" height="88" fill="#12121a" stroke="#2a2a3a"/>
  <rect x="586" y="48" width="128" height="3" fill="#ff4466"/>
  <text x="650" y="76" text-anchor="middle" class="stage" fill="#ff4466">SKILLS</text>
  <text x="650" y="98" text-anchor="middle" class="repo">product-plugins</text>
  <text x="650" y="118" text-anchor="middle" class="desc">repeatable work</text>
  <text x="721" y="97" class="arrow">&#8594;</text>

  <!-- production -->
  <rect x="726" y="48" width="128" height="88" fill="#12121a" stroke="#e0dfe6"/>
  <rect x="726" y="48" width="128" height="3" fill="#ffffff"/>
  <text x="790" y="76" text-anchor="middle" class="stage" fill="#ffffff">PRODUCTION</text>
  <text x="790" y="98" text-anchor="middle" class="repo">whisperly.io</text>
  <text x="790" y="118" text-anchor="middle" class="desc">where it survives</text>

  <text x="26" y="162" class="desc">each stage is a public artifact &#183; built and run by one product manager</text>
</svg>
